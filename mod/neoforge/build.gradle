import me.modmuss50.mpp.ReleaseType

plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
    id 'me.modmuss50.mod-publish-plugin'
    id 'publish-local'
}

neoForge {
    version = neoforge_version

    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    runs {
        client {
            type = "client"
            gameDirectory = project.file('run/client')
            ideName = "NeoForge Client ($project.path)"
            sourceSet = sourceSets.main
            loadedMods = [mods."$mod_id"]
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation libs.fidgetz.neoforge
}

publishMods {
    dryRun = Boolean.valueOf(dry_run)
    type = ReleaseType.of(release_type)
    changelog = rootProject.file("CHANGELOG.md").text
    file = jar.archiveFile
    additionalFiles.from(sourcesJar.archiveFile)
    displayName = "NeoForge v${this.version}"
    modLoaders.add("neoforge")

    github {
        parent rootProject.tasks.named("publishGithub")
        accessToken = findProperty("GITHUB_TOKEN") ?: ""
    }

    modrinth {
        accessToken = findProperty("MODRINTH_TOKEN") ?: ""
        minecraftVersions.addAll(modrinth_versions.split(','))
        projectId = modrinth_id
        requires("fidgetz")
    }

    curseforge {
        accessToken = findProperty("CURSEFORGE_TOKEN") ?: ""
        projectId = curseforge_id
        minecraftVersions.addAll(curseforge_versions.split(','))
        client = true
        requires("fidgetz")
    }
}
